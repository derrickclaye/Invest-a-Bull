name: Daily Market Refresh

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

  refresh-analysis:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Refresh reports, README, and notebook
        env:
          MPLBACKEND: Agg
        run: |
          python run_latest_top5_analysis.py

      - name: Guard against fallback-universe results
        run: |
          import json, sys
          meta = json.loads(open("data/processed/latest_run_metadata.json").read())
          src = meta.get("selection_source", "")
          if src.startswith("fallback_momentum_universe"):
              print(f"::error::Pipeline used fallback universe ({src}). Skipping commit to avoid publishing stale results.")
              sys.exit(1)
          print(f"Selection source OK: {src}")
        shell: python

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MasterAnalysisFinal.ipynb data/processed reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: refresh daily market analysis [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

