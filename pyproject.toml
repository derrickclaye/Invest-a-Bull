[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-a-bull"
version = "0.3.0"
description = "Senior-style market analysis pipeline for trending U.S. stocks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Invest-a-Bull" }]
dependencies = [
    "bokeh>=3.9,<4",
    "hvplot>=0.12,<0.13",
    "matplotlib>=3.10,<4",
    "numpy>=2.4,<3",
    "pandas>=3.0,<3.1",
    "panel>=1.8,<2",
    "plotly>=6.7,<7",
    "python-dotenv>=1.1,<2",
    "requests>=2.33,<3",
    "scipy>=1.17,<2",
    "seaborn>=0.13,<0.14",
    "websockets>=15,<16",
    "yfinance>=1.2,<2",
]

[project.scripts]
invest-a-bull-latest = "invest_a_bull.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

